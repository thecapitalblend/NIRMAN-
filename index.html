<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#22303C" />
<title>Nirman Hisab — Construction Ka Hisab</title>
<meta name="description" content="Apni construction site ka poora hisab-kitab — material, majdoori, kharch aur aamdani." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="app">

    <!-- HEADER -->
    <header class="header">
      <div class="header-top">
        <div>
          <div class="brand-eyebrow">NIRMAN HISAB · साइट रजिस्टर</div>
          <div class="brand-title">निर्माण हिसाब</div>
        </div>
        <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
      </div>
      <div class="header-balance-row">
        <div>
          <div class="balance-label">कुल बकाया (Total Balance)</div>
          <div id="totalBalance" class="balance-value">₹0</div>
        </div>
        <div class="mini-stats">
          <div class="mini-stat"><span class="income-text">▲ आया</span> <b id="totalIncome" class="mono">₹0</b></div>
          <div class="mini-stat"><span class="expense-text">▼ गया</span> <b id="totalExpense" class="mono">₹0</b></div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="content" class="content"></main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-btn" data-tab="dashboard"><span>🏠</span><small>Home</small></button>
      <button class="nav-btn" data-tab="sites"><span>🏘️</span><small>Sites</small></button>
      <button class="fab" data-tab="add"><span>➕</span></button>
      <button class="nav-btn" data-tab="ledger"><span>📒</span><small>Ledger</small></button>
      <button class="nav-btn" data-tab="settings"><span>⚙️</span><small>Settings</small></button>
    </nav>
  </div>

  <!-- hidden file input for restore -->
  <input type="file" id="restoreFile" accept="application/json" style="display:none" />

  <script src="js/app.js"></script>
</body>
</html>
